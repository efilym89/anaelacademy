<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Академия студий лазерной эпиляции Annaelle</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="noise"></div>
    <div class="app-shell">
      <header class="topbar">
        <div class="identity">
          <div class="avatar" aria-hidden="true">A</div>
          <div class="identity__copy">
            <p class="eyebrow" id="brandEyebrow">Учебная платформа</p>
            <h1 id="brandTitle">Академия студий лазерной эпиляции Annaelle</h1>
            <p class="muted" id="brandSubtitle">Мобильная программа обучения для команды студий Annaelle</p>
          </div>
        </div>
        <button class="chip" id="roleChip" type="button">Гость</button>
      </header>

      <main id="view" class="view"></main>

      <nav class="bottom-nav" aria-label="Навигация по разделам">
        <button class="tab active" data-tab="home" type="button">
          <span class="icon" aria-hidden="true">HM</span>
          <span>Главная</span>
        </button>
        <button class="tab" data-tab="community" type="button">
          <span class="icon" aria-hidden="true">CM</span>
          <span>Сообщество</span>
        </button>
        <button class="tab" data-tab="chats" type="button">
          <span class="icon" aria-hidden="true">CH</span>
          <span>Чаты</span>
        </button>
        <button class="tab" data-tab="favorites" type="button">
          <span class="icon" aria-hidden="true">FV</span>
          <span>Избранное</span>
        </button>
        <button class="tab" data-tab="ambassadors" type="button">
          <span class="icon" aria-hidden="true">PR</span>
          <span>Профиль</span>
        </button>
      </nav>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
